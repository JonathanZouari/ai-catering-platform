<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ממשק העסק</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <main>
    <h1>ממשק העסק</h1>
    <p>בבנייה. ראו docs/UX_UI_SPEC.md.</p>
    <p>מצב השרת: <span id="status" aria-live="polite">checking…</span></p>
  </main>
  <script type="module">
    import { api } from "/js/api.js";
    const el = document.getElementById("status");
    api("/health").then((r) => (el.textContent = r.status)).catch((e) => (el.textContent = e.message));
  </script>
</body>
</html>
