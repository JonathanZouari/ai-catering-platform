<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff9ed">
  <title>כניסה | yumm.ai</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/customer.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <main class="auth">
    <p class="brand wordmark"><a class="brand-link" href="/" aria-label="yumm.ai, לעמוד הבית"><bdi>yumm<span class="dot">.</span>ai</bdi></a></p>
    <form id="auth-form" class="panel stack" novalidate>
      <h1 id="auth-title" class="auth-title">כניסה לחשבון</h1>
      <div id="name-field" class="field" hidden>
        <label for="auth-name">שם מלא</label>
        <input id="auth-name" class="input" type="text" autocomplete="name">
      </div>
      <div class="field">
        <label for="auth-email">אימייל</label>
        <input id="auth-email" class="input" type="email" autocomplete="username" dir="ltr" required>
      </div>
      <div class="field">
        <label for="auth-password">סיסמה</label>
        <input id="auth-password" class="input" type="password" autocomplete="current-password" dir="ltr" minlength="8" required>
        <p id="password-hint" class="hint" hidden>לפחות 8 תווים.</p>
      </div>
      <p id="auth-error" class="error" role="alert" hidden></p>
      <button id="auth-submit" class="btn btn-primary btn-block" type="submit">כניסה</button>
      <button id="auth-toggle" class="link-btn" type="button">אין לכם חשבון? הרשמה</button>
    </form>
  </main>
  <script src="/assets/vendor/supabase-2.119.0.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
