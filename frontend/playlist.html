<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; form-action 'self'; base-uri 'none'">
<title>פלייליסט לאירוע · Yummai</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="landing">
<a class="skip-link" href="#main">דילוג לתוכן</a>
<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="/" lang="en">Yummai</a>
    <nav aria-label="ניווט ראשי">
      <ul class="nav">
      <li><a href="/">ראשי</a></li>
      <li><a href="/customer/#event">תכנון אירוע</a></li>
      </ul>
    </nav>
  </div>
</header>
<main id="main" class="inner">
  <div class="wrap playlist-page">
    <div class="page-head">
      <h1>פלייליסט לאירוע</h1>
      <p>בוחרים אווירה ולוחצים על נגן. הפלייליסט ייפתח בספוטיפיי.</p>
    </div>
    <fieldset>
      <legend class="sr-only">בחירת אווירה</legend>
      <div class="options">
        <label class="option"><input type="radio" name="mood" value="calm" checked><strong>ערב רגוע</strong><span>ג'אז וקלאסיקות לארוחה נעימה</span></label>
        <label class="option"><input type="radio" name="mood" value="party"><strong>מסיבה</strong><span>להיטים שמרימים לרחבה</span></label>
        <label class="option"><input type="radio" name="mood" value="kumsitz"><strong>קומזיץ</strong><span>שירים לשיר יחד סביב המדורה</span></label>
        <label class="option"><input type="radio" name="mood" value="family"><strong>אירוע משפחתי</strong><span>מוזיקה טובה לכל הגילים</span></label>
      </div>
    </fieldset>
    <a class="btn btn-primary btn-lg play" data-mood="calm" href="https://open.spotify.com/search/dinner%20jazz/playlists" target="_blank" rel="noopener" aria-label="נגן פלייליסט ערב רגוע בספוטיפיי">נגן</a>
    <a class="btn btn-primary btn-lg play" data-mood="party" href="https://open.spotify.com/search/party%20hits/playlists" target="_blank" rel="noopener" aria-label="נגן פלייליסט מסיבה בספוטיפיי">נגן</a>
    <a class="btn btn-primary btn-lg play" data-mood="kumsitz" href="https://open.spotify.com/search/%D7%A9%D7%99%D7%A8%D7%99%20%D7%9E%D7%93%D7%95%D7%A8%D7%94/playlists" target="_blank" rel="noopener" aria-label="נגן פלייליסט קומזיץ בספוטיפיי">נגן</a>
    <a class="btn btn-primary btn-lg play" data-mood="family" href="https://open.spotify.com/search/family%20feel%20good/playlists" target="_blank" rel="noopener" aria-label="נגן פלייליסט אירוע משפחתי בספוטיפיי">נגן</a>
  </div>
</main>
</body>
</html>
