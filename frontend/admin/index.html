<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ממשק העסק</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <a class="skip-link" href="#main">דילוג לתוכן</a>
  <main id="main" tabindex="-1">
    <h1>ממשק העסק</h1>
    <p>בבנייה. ראו docs/UX_UI_SPEC.md.</p>
    <p>מצב השרת: <span id="status" aria-live="polite">checking…</span></p>
  </main>
  <footer><p><a href="/accessibility/">הצהרת נגישות</a></p></footer>
  <script type="module">
    import { api } from "/js/api.js";
    const el = document.getElementById("status");
    api("/health").then((r) => (el.textContent = r.status)).catch((e) => (el.textContent = e.message));
  </script>
</body>
</html>
