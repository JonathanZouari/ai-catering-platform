<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Montserrat:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="currentColor" d="M15 4h2v12a3 3 0 0 0 2 2.8V44h-4V18.8A3 3 0 0 0 17 16V4h-2v10h-2V4h-2v10H9V4H7v12a5 5 0 0 0 4 4.9V44h4z"/>
        <ellipse cx="33" cy="13" rx="6" ry="9" fill="currentColor"/>
        <rect x="31" y="21" width="4" height="23" rx="2" fill="currentColor"/>
      </svg>
      Catering
    </a>
    <a class="btn btn--ghost" href="/admin/">Business login</a>
  </header>

  <section class="hero" aria-labelledby="hero-title">
    <div class="hero__inner">
      <div>
        <h1 id="hero-title" class="display-title">
          <span class="display-title__strong">Catering</span>
          <span class="display-title__soft">Services</span>
        </h1>
        <p class="lead">Build your event menu, see the price instantly, and let our AI assistant help you plan.</p>
        <div class="actions">
          <a class="btn btn--primary" href="/customer/">Plan your event</a>
        </div>
      </div>
      <div class="plates" aria-hidden="true">
        <!-- Placeholder plates; replace with real dish photos in frontend/assets/. -->
        <div class="ring-photo">🥗</div>
        <div class="ring-photo ring-photo--sm">🍤</div>
      </div>
    </div>
    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
      <path class="wave__fill" d="M0 70 C 360 0, 900 140, 1440 40 V120 H0 Z"/>
      <path class="wave__edge" d="M0 70 C 360 0, 900 140, 1440 40"/>
    </svg>
  </section>

  <main>
    <h2>Our services</h2>
    <ul class="check-list">
      <li>Specialty catering</li>
      <li>Birthday events</li>
      <li>Family events</li>
      <li>BBQ catering</li>
      <li>Weddings</li>
      <li>Office events</li>
    </ul>
    <div class="badge-circle" aria-label="Free quote">
      <span><strong>Free</strong>quote</span>
    </div>
  </main>
</body>
</html>
