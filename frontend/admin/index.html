<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ממשק העסק</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <a class="skip-link" href="#main">דילוג לתוכן</a>
  <main id="main" tabindex="-1">
    <h1>ממשק העסק</h1>
    <p>ממשק העסק נמצא בבנייה.</p>
    <p>מצב השרת: <span id="status" role="status">בודק…</span></p>
  </main>
  <footer class="accessibility-footer"><a href="/accessibility/">הצהרת נגישות וסיוע</a></footer>
  <script type="module">
    import { api } from "/js/api.js";
    const el = document.getElementById("status");
    api("/health").then(() => (el.textContent = "השרת זמין")).catch(() => (el.textContent = "לא ניתן להתחבר לשרת. נסו לרענן את הדף."));
  </script>
</body>
</html>
