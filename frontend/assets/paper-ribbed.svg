<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Ribbed cream paper: stretched noise gives the horizontal ribs, side light embosses them -->
  <filter id="ribs" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0021 0.2" numOctaves="2" seed="7" stitchTiles="stitch"/>
    <feDiffuseLighting surfaceScale="0.55" lighting-color="#FDF7E8">
      <feDistantLight azimuth="90" elevation="75"/>
    </feDiffuseLighting>
  </filter>
  <rect width="480" height="480" filter="url(#ribs)"/>
</svg>
