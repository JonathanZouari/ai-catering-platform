<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול העסק · מוגש</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Heebo:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <main>
    <h1>ניהול העסק</h1>
    <p>המסכים ייבנו בשלבים הבאים (ראו docs/UX_UI_SPEC.md).</p>
    <p>סטטוס שרת: <span id="status" aria-live="polite">בודק…</span></p>
  </main>
  <script type="module">
    import { api } from "/js/api.js";
    const el = document.getElementById("status");
    api("/health").then((r) => (el.textContent = r.status)).catch((e) => (el.textContent = e.message));
  </script>
</body>
</html>
