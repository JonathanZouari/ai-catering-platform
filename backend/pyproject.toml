[project]
name = "ai-catering-platform"
version = "0.1.0"
description = "AI-powered Hebrew catering ordering platform for many caterers (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.1.6",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
